{{define "content"}}
<div class="form-container">
    <div class="form-card">
        <h2>Create New Booking</h2>
        
        {{if .Error}}
        <div class="message message-error">{{.Error}}</div>
        {{end}}

        {{if .Success}}
        <div class="message message-success">{{.Success}}</div>
        {{end}}

        <form method="POST" action="/bookings/create" class="booking-form" id="bookingForm">
            <div class="form-group">
                <label for="resource_id">Resource</label>
                <select id="resource_id" name="resource_id" required onchange="updatePricePreview()">
                    <option value="">Select a resource</option>
                    {{range .Resources}}
                    <option value="{{.ID}}" 
                            data-type="{{.BookingType}}"
                            data-price="{{.Price}}"
                            data-sale-price="{{.SalePrice}}"
                            {{if eq $.PreselectedResourceID (printf "%d" .ID)}}selected{{end}}>
                        {{.Name}} - {{.Category}} ({{.Location}})
                        {{if eq .BookingType "sale"}}
                        - ${{printf "%.2f" .SalePrice}}
                        {{else}}
                        - ${{printf "%.2f" .Price}}/hr
                        {{end}}
                    </option>
                    {{end}}
                </select>
            </div>

            <div id="booking_time_fields">
                <div class="form-group">
                    <label for="start_time">Start Time</label>
                    <input type="datetime-local" id="start_time" name="start_time" onchange="updatePricePreview()">
                </div>
                <div class="form-group">
                    <label for="end_time">End Time</label>
                    <input type="datetime-local" id="end_time" name="end_time" onchange="updatePricePreview()">
                </div>
            </div>

            <div id="price_preview" class="price-preview" style="display: none;">
                <div class="price-preview-card">
                    <h3>Estimated Price</h3>
                    <div class="price-amount" id="price_amount">$0.00</div>
                    <small id="price_details"></small>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submit_btn">Create Booking</button>
                <a href="/dashboard" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<script>
const resources = {
    {{range .Resources}}
    {{.ID}}: {
        type: "{{.BookingType}}",
        price: {{.Price}},
        salePrice: {{.SalePrice}}
    },
    {{end}}
};

function updatePricePreview() {
    const resourceId = document.getElementById('resource_id').value;
    const pricePreview = document.getElementById('price_preview');
    const priceAmount = document.getElementById('price_amount');
    const priceDetails = document.getElementById('price_details');
    const bookingTimeFields = document.getElementById('booking_time_fields');
    const submitBtn = document.getElementById('submit_btn');
    const startTimeInput = document.getElementById('start_time');
    const endTimeInput = document.getElementById('end_time');

    if (!resourceId || !resources[resourceId]) {
        pricePreview.style.display = 'none';
        return;
    }

    const resource = resources[resourceId];

    if (resource.type === 'sale') {
        // Sale - show fixed price, hide time fields
        bookingTimeFields.style.display = 'none';
        startTimeInput.required = false;
        endTimeInput.required = false;
        pricePreview.style.display = 'block';
        priceAmount.textContent = '$' + resource.salePrice.toFixed(2);
        priceDetails.textContent = 'Fixed sale price';
        submitBtn.textContent = 'Purchase';
    } else {
        // Booking - show time fields, calculate price
        bookingTimeFields.style.display = 'block';
        startTimeInput.required = true;
        endTimeInput.required = true;
        
        const startTime = startTimeInput.value;
        const endTime = endTimeInput.value;

        if (startTime && endTime) {
            const start = new Date(startTime);
            const end = new Date(endTime);
            
            if (end > start) {
                const hours = (end - start) / (1000 * 60 * 60);
                const totalPrice = resource.price * hours;
                pricePreview.style.display = 'block';
                priceAmount.textContent = '$' + totalPrice.toFixed(2);
                priceDetails.textContent = resource.price.toFixed(2) + '/hr × ' + hours.toFixed(1) + ' hours';
                submitBtn.textContent = 'Create Booking';
            } else {
                pricePreview.style.display = 'none';
            }
        } else {
            pricePreview.style.display = 'none';
            submitBtn.textContent = 'Create Booking';
        }
    }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    updatePricePreview();
});
</script>
{{end}}
